syntax = "proto3";
package bug;

service BugService {
  rpc CreateBug (CreateBugRequest) returns (BugResponse);
  rpc GetBug (GetBugRequest) returns (BugResponse);
  rpc ListBugs (ListBugsRequest) returns (ListBugsResponse);
  rpc UpdateBugStatus (UpdateBugStatusRequest) returns (BugResponse);
  rpc AssignBug (AssignBugRequest) returns (BugResponse);
  rpc AddCc (AddCcRequest) returns (BugResponse);
  rpc RemoveCc (RemoveCcRequest) returns (BugResponse);
  rpc AttachFile (AttachFileRequest) returns (BugResponse);
}

message Bug {
  string id = 1;
  string title = 2;
  string description = 3;
  string status = 4;
  string severity = 5;
  string creator = 6;
  string assignee = 7;
  repeated string ccList = 8;
  repeated string attachmentIds = 9;
  string createdAt = 10;
  string updatedAt = 11;
  repeated HistoryItem history = 12;
}

message HistoryItem {
  string action = 1;
  string from = 2;
  string to = 3;
  string operator = 4;
  string remark = 5;
  string at = 6;
}

message CreateBugRequest {
  string title = 1;
  string description = 2;
  string severity = 3;
  string creator = 4;
  string assignee = 5;
  repeated string ccList = 6;
}

message GetBugRequest { string id = 1; }

message ListBugsRequest { string status = 1; string assignee = 2; }

message ListBugsResponse { repeated Bug bugs = 1; }

message UpdateBugStatusRequest {
  string id = 1;
  string status = 2;
  string operator = 3;
  string remark = 4;
}

message AssignBugRequest {
  string id = 1;
  string assignee = 2;
  string operator = 3;
  string remark = 4;
}

message AddCcRequest {
  string id = 1;
  repeated string users = 2;
  string operator = 3;
}

message RemoveCcRequest {
  string id = 1;
  repeated string users = 2;
  string operator = 3;
}

message AttachFileRequest {
  string bugId = 1;
  string fileId = 2;
  string operator = 3;
}

message BugResponse { Bug bug = 1; }
